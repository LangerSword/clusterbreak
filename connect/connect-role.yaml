AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Clusterbreak connect stack — creates the scoped role Clusterbreak assumes to
  deploy and tear down rigs in THIS account. No long-lived keys are ever
  exchanged. Delete this stack at any time to revoke access.

Parameters:
  ExternalId:
    Type: String
    MinLength: 16
    MaxLength: 64
    Description: Per-user secret generated by Clusterbreak; required by the trust policy.
  ClusterbreakPrincipalArn:
    Type: String
    Default: arn:aws:iam::703651068111:role/clusterbreak-lambda-role
    Description: The exact Clusterbreak backend role allowed to assume the deploy role.

Resources:
  # Only CloudFormation-with-this-role can create resources → the assumed role
  # never needs broad EC2 permissions itself.
  StackExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ClusterbreakStackRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: clusterbreak-rig-provisioning
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Vpc
                Effect: Allow
                Action:
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:ModifyVpcAttribute
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:CreateInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:CreateRouteTable
                  - ec2:CreateRoute
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:DeleteRoute
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:CreateTags
                Resource: "*"
              - Sid: ReadOnly
                Effect: Allow
                Action: "ec2:Describe*"
                Resource: "*"
              - Sid: Instances
                Effect: Allow
                Action:
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                  - ec2:CreateLaunchTemplate
                  - ec2:DeleteLaunchTemplate
                Resource: "*"
              - Sid: AmiLookup
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource:
                  - arn:aws:ssm:*::parameter/aws/service/canonical/*
                  # GPU nodes run the AWS Deep Learning base AMI (driver +
                  # container toolkit preinstalled), whose id also comes from a
                  # public SSM parameter. Without this second path the stack
                  # execution role cannot resolve the GPU AMI and every GPU
                  # launch fails with AccessDenied on ssm:GetParameters.
                  - arn:aws:ssm:*::parameter/aws/service/deeplearning/*

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ClusterbreakDeployRole
      Description: Assumed by the Clusterbreak backend (ExternalId required) to manage clusterbreak-* stacks in this account.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref ClusterbreakPrincipalArn }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { sts:ExternalId: !Ref ExternalId }
      Policies:
        - PolicyName: clusterbreak-stacks-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read: every stack's metadata (the same thing you can already see
              # in your own console) — without this, a clusterbreak-* stack
              # created outside the app is invisible here and still blocks its
              # own name forever.
              - Sid: ReadStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  # the paginated listing API (used to enumerate clusterbreak-*
                  # stacks in the account) is gated by ListStacks, not DescribeStacks
                  - cloudformation:ListStacks
                Resource: "*"
              # Write: only clusterbreak-* stacks. This is the boundary that
              # matters — Clusterbreak can never touch anything else.
              - Sid: Stacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/clusterbreak-*/*"
              - Sid: PassExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt StackExecutionRole.Arn
              - Sid: ReadQuotas
                Effect: Allow
                Action:
                  - servicequotas:GetServiceQuota
                  - servicequotas:ListServiceQuotas
                Resource: "*"
              # Read-only EC2 metadata so the UI can offer your key pairs in a
              # dropdown and show what a rig is actually running (describe
              # actions cannot be resource-scoped; nothing here can mutate).
              - Sid: ReadEc2
                Effect: Allow
                Action:
                  - ec2:DescribeKeyPairs
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                Resource: "*"

Outputs:
  DeployRoleArn:
    Description: Paste this into Clusterbreak to finish connecting.
    Value: !GetAtt DeployRole.Arn
  StackExecutionRoleArn:
    Description: Passed to CloudFormation so rig provisioning runs under this role.
    Value: !GetAtt StackExecutionRole.Arn
